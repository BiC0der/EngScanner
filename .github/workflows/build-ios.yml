name: iOS IPA Build & Release Pipeline

on:
  push:
    branches: [ main, release/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      export_method:
        description: 'IPA Export Method'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - enterprise
          - app-store

jobs:
  build-and-export-ipa:
    name: Build & Package iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project (.xcodeproj)
        run: |
          xcodegen generate --spec project.yml
          ls -la EngScanner.xcodeproj

      # -------------------------------------------------------------
      # Code Signing Setup (Optional if GitHub Secrets are present)
      # -------------------------------------------------------------
      - name: Configure Signing Assets
        if: ${{ env.HAVE_SIGNING_SECRETS == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          HAVE_SIGNING_SECRETS: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          PP_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # -------------------------------------------------------------
      # Compile & Build Archive (.xcarchive)
      # -------------------------------------------------------------
      - name: Build Xcode Archive (.xcarchive)
        run: |
          mkdir -p build/output
          
          xcodebuild archive \
            -project EngScanner.xcodeproj \
            -scheme EngScanner \
            -destination "generic/platform=iOS" \
            -archivePath "build/EngScanner.xcarchive" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # -------------------------------------------------------------
      # Package into .IPA (Payload structure)
      # -------------------------------------------------------------
      - name: Package Application into IPA
        run: |
          mkdir -p build/ipa_payload/Payload
          
          # Copy compiled .app bundle into standard iOS Payload folder
          cp -r build/EngScanner.xcarchive/Products/Applications/EngScanner.app build/ipa_payload/Payload/
          
          # Create IPA archive
          cd build/ipa_payload
          zip -r -y ../output/EngScanner.ipa Payload
          cd ../..
          
          # Verify IPA was created and display size
          ls -lh build/output/EngScanner.ipa
          
          if [ ! -f "build/output/EngScanner.ipa" ]; then
            echo "::error::IPA packaging failed!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngScanner-iOS-IPA
          path: build/output/EngScanner.ipa
          retention-days: 14

      # -------------------------------------------------------------
      # Create GitHub Release on Tag
      # -------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/output/EngScanner.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
